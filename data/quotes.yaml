# Lines cycled by the typed masthead on the home page.
#
# `pre`    renders in --ink (the body text colour)
# `accent` renders in --accent (the one accent colour)
# "\n"     forces a line break; a trailing space keeps the line running on
#
# These are placeholders. Override them by creating data/quotes.yaml in your own
# site root — your file replaces this one wholesale, it does not merge into it.
lines:
  - pre: "From initial scribbles to live links, \n"
    accent: "explore what I've been creating."
  - pre: "A peek inside my mind, \n"
    accent: "hosted on a single domain."
  - pre: "My words, your setup. \n"
    accent: "Toggle the theme to fit your vibe."
  - pre: "Check out my novel:\n"
    accent: "https://mybook.to/strandednovel"
  - pre: "The spark of a great idea, \n"
    accent: "brought to life with text."
  - pre: "Pixels, prose and projects. \n"
    accent: "The digital archive of my work."
  - pre: "One font. Four palettes. \n"
    accent: "Customisation to your preference."
  - pre: "All the pathways I follow,\n"
    accent: "Condensed onto one website."
  - pre: "Crafting fictional worlds, \n"
    accent: "one sentance at a time."
  - pre: "The journey begins here. \n"
    accent: "Read the opening chapters online."
